site_name: In the Cloud - Service Catalog
theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  logo: assets/inc-logo.webp
  favicon: assets/inc-logo.webp
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Services: services/index.md
  - About: about.md
  - Contact: contact.md
