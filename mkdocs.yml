site_name: In the Cloud - Service Catalog
theme:
  name: material
  logo: assets/inc-logo.webp
  favicon: assets/inc-logo.webp
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Service Packages:
      - Overview: services/index.md
      - "Azure & Cloud Adoption":
          - "IP-11 Azure Landing Zones": services/ip-11-azure-landing-zones.md
          - "IP-12 Azure Cloud Adoption Framework — End-to-End": services/ip-12-azure-cloud-adoption-framework.md
          - "IP-16 Azure Advisor Assessment & Remediation": services/ip-16-azure-advisor-remediation.md
      - "Windows Server & Infrastructure":
          - "IP-01 Windows Server Migration Assessment & Roadmap": services/ip-01-windows-server-migration-assessment.md
          - "IP-02 Windows Server Migration Implementation": services/ip-02-windows-server-migration-implementation.md
          - "IP-04 Linux Platform Standardization & Security": services/ip-04-linux-standardization-hardening.md
          - "IP-14 AD DS Assessment & Remediation": services/ip-14-ad-ds-assessment-remediation.md
          - "IP-17 Windows Server CIS Benchmark": services/ip-17-windows-server-cis-benchmark.md
      - "Identity & Security":
          - "IP-03 Service Account Security Assessment & Remediation": services/ip-03-service-account-security.md
          - "IP-05 AWS Identity & Access Baseline": services/ip-05-aws-identity-access-baseline.md
          - "IP-13 Hybrid Identity Assessment & Remediation": services/ip-13-hybrid-identity-assessment-remediation.md
      - "Microsoft 365 & Zero Trust":
          - "IP-06 Microsoft 365 Security Baseline": services/ip-06-m365-security-baseline.md
          - "IP-07 Microsoft 365 Compliance Readiness": services/ip-07-m365-compliance-readiness.md
          - "IP-08 Secure AI Apps & Data": services/ip-08-secure-ai-apps-data.md
          - "IP-15 Microsoft 365 Zero Trust": services/ip-15-microsoft-365-zero-trust.md
          - "IP-18 Microsoft 365 CIS Benchmark": services/ip-18-m365-cis-benchmark.md
      - "AI & Technical Support":
          - "IP-09 Enterprise MCP Server": services/ip-09-enterprise-mcp-server.md
          - "IP-10 Professional Support": services/ip-10-professional-support.md
